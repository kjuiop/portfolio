name: Deploy to S3

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Install dependencies
        run: npm install

      - name: Build Vite App
        run: npm run build

      - name: Setup payments directory
        run: |
          mkdir -p dist/payments
          mkdir -p dist/payment-success
          mkdir -p dist/payment-failure
          cp dist/payments.html dist/payments/index.html
          cp dist/payment-success.html dist/payment-success/index.html
          cp dist/payment-failure.html dist/payment-failure/index.html
          ls -la dist/payments/
          ls -la dist/payment-success/
          ls -la dist/payment-failure/

      - name: Upload to S3
        run: |
          aws s3 sync dist/ s3://giglab-side-app/portfolio/ --delete
          aws s3 ls s3://giglab-side-app/portfolio/payments/ --recursive
          aws s3 ls s3://giglab-side-app/portfolio/payment-success/ --recursive
          aws s3 ls s3://giglab-side-app/portfolio/payment-failure/ --recursive
        run: |
          aws s3 sync dist/ s3://giglab-side-app/portfolio/ --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_DEPLOY_CF_ID }} \
            --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2